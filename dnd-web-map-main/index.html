<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>THE FLOOD</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap');

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #060606;
      color: #ccc;
      font-family: 'Share Tech Mono', 'Courier New', monospace;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ── Scanline overlay ── */
    body::before {
      content: '';
      position: fixed; inset: 0;
      background: repeating-linear-gradient(
        0deg,
        transparent,
        transparent 2px,
        rgba(0,0,0,0.08) 2px,
        rgba(0,0,0,0.08) 4px
      );
      pointer-events: none; z-index: 999;
    }

    /* ── Hero ── */
    #hero {
      flex: 1;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      padding: 60px 20px 40px;
      text-align: center;
      position: relative;
    }

    .virus-ring {
      position: absolute;
      width: 400px; height: 400px;
      border-radius: 50%;
      border: 1px solid #1a0000;
      box-shadow: 0 0 60px rgba(180,0,0,0.06);
      animation: pulse 4s ease-in-out infinite;
    }
    .virus-ring:nth-child(2) { width: 600px; height: 600px; animation-delay: 1s; }
    .virus-ring:nth-child(3) { width: 800px; height: 800px; animation-delay: 2s; }
    @keyframes pulse {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 0.8; }
    }

    .hero-content { position: relative; z-index: 1; }

    .title-tag { font-size: 10px; letter-spacing: 6px; color: #400; margin-bottom: 16px; }

    h1 {
      font-size: clamp(48px, 10vw, 90px);
      color: #c00;
      letter-spacing: 16px;
      text-shadow: 0 0 40px rgba(200,0,0,0.4);
      margin-bottom: 8px;
      line-height: 1;
    }

    .tagline {
      font-size: 13px;
      color: #444;
      letter-spacing: 3px;
      margin-bottom: 48px;
      line-height: 1.8;
    }
    .tagline em { color: #666; font-style: normal; }

    /* ── Buttons ── */
    .btn-group { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; margin-bottom: 48px; }

    .btn {
      padding: 12px 32px;
      font-family: inherit; font-size: 12px;
      letter-spacing: 3px; cursor: pointer;
      border: 1px solid; text-decoration: none;
      display: inline-block; transition: all .2s;
    }
    .btn-enter {
      background: #1a0000; border-color: #800; color: #f44;
      box-shadow: 0 0 20px rgba(200,0,0,0.15);
    }
    .btn-enter:hover {
      background: #2a0000; border-color: #f00; color: #f88;
      box-shadow: 0 0 30px rgba(200,0,0,0.3);
    }
    .btn-gm {
      background: transparent; border-color: #2a2a2a; color: #444;
    }
    .btn-gm:hover { border-color: #555; color: #888; }

    /* ── Status Bar ── */
    #status-bar {
      display: flex; justify-content: center; gap: 32px;
      padding: 12px 20px; border-top: 1px solid #111;
      font-size: 10px; color: #333;
    }
    .sitem span { color: #666; }
    .sitem.online span { color: #4a4; }
    .sitem.warning span { color: #a84; }
    .sitem.danger span { color: #f44; }

    /* ── News Section ── */
    #news {
      background: #0a0a0a; border-top: 1px solid #111;
      padding: 32px 20px; max-width: 700px; margin: 0 auto; width: 100%;
    }
    #news h2 {
      font-size: 10px; letter-spacing: 4px; color: #333;
      margin-bottom: 20px; border-bottom: 1px solid #111; padding-bottom: 8px;
    }

    .news-item {
      padding: 14px 0; border-bottom: 1px solid #0f0f0f;
    }
    .news-item:last-child { border-bottom: none; }
    .news-date { font-size: 9px; color: #333; margin-bottom: 4px; }
    .news-tag {
      display: inline-block; font-size: 8px; padding: 1px 5px;
      border-radius: 1px; margin-right: 6px; vertical-align: middle;
    }
    .tag-system { background: #001a2a; color: #46a; }
    .tag-story { background: #1a0000; color: #a44; }
    .tag-update { background: #0a1a00; color: #464; }
    .news-title { font-size: 12px; color: #888; margin-bottom: 4px; }
    .news-body { font-size: 11px; color: #444; line-height: 1.8; }

    /* ── Footer ── */
    footer {
      text-align: center; padding: 16px;
      font-size: 9px; color: #222; border-top: 1px solid #0f0f0f;
    }
  </style>
</head>
<body>

<!-- Hero -->
<div id="hero">
  <div class="virus-ring"></div>
  <div class="virus-ring"></div>
  <div class="virus-ring"></div>

  <div class="hero-content">
    <div class="title-tag">SURVIVAL · TURN-BASED · CO-OP</div>
    <h1>THE FLOOD</h1>
    <div class="tagline">
      ไม่มีทางรักษา<br/>
      <em>มีแค่ทางเลือก</em>
    </div>

    <div class="btn-group">
      <a href="player.html" class="btn btn-enter">เข้าสู่เกม</a>
      <a href="gm.html" class="btn btn-gm">GM</a>
    </div>
  </div>
</div>

<!-- Status Bar -->
<div id="status-bar">
  <div class="sitem" id="stat-season">
    SEASON &nbsp;<span>1</span>
  </div>
  <div class="sitem online" id="stat-server">
    SERVER &nbsp;<span>ONLINE</span>
  </div>
  <div class="sitem" id="stat-players">
    PLAYERS &nbsp;<span id="player-count">—</span>
  </div>
  <div class="sitem warning" id="stat-infection">
    GLOBAL INFECTION &nbsp;<span id="infection-level">—</span>
  </div>
</div>

<!-- News -->
<div id="news">
  <h2>TRANSMISSIONS — ข่าวสาร</h2>
  <div id="news-list">
    <!-- โหลดจาก Firestore -->
    <div class="news-item">
      <div class="news-date">—</div>
      <div class="news-body" style="color:#222">กำลังโหลดข้อมูล...</div>
    </div>
  </div>
</div>

<footer>THE FLOOD — SEASON 1 &nbsp;|&nbsp; GM-DRIVEN SURVIVAL</footer>

<script type="module">
import { db } from "./firebase";
import { doc, onSnapshot, collection, query, orderBy, limit } from "firebase/firestore";

// ── Live game status ──────────────────────────────────────

onSnapshot(doc(db, "games/session_1"), (snap) => {
  if (!snap.exists()) return;
  try {
    const state = JSON.parse(snap.data().state);

    // player count
    const alive = state.players?.filter(p => p.alive).length ?? "—";
    document.getElementById("player-count").textContent = alive + " alive";

    // infection
    const inf = state.world?.globalInfectionLevel ?? "—";
    const infEl = document.getElementById("infection-level");
    infEl.textContent = inf + "%";
    const statInf = document.getElementById("stat-infection");
    if (inf >= 70) statInf.className = "sitem danger";
    else if (inf >= 40) statInf.className = "sitem warning";
    else statInf.className = "sitem";

  } catch {}
});

// ── News ─────────────────────────────────────────────────

onSnapshot(
  query(collection(db, "news"), orderBy("createdAt", "desc"), limit(10)),
  (snap) => {
    const list = document.getElementById("news-list");

    if (snap.empty) {
      list.innerHTML = `
        <div class="news-item">
          <div class="news-body" style="color:#2a2a2a">ยังไม่มีข้อมูล — GM จะอัพเดทที่นี่</div>
        </div>`;
      return;
    }

    list.innerHTML = snap.docs.map(d => {
      const n = d.data();
      const date = n.createdAt
        ? new Date(n.createdAt).toLocaleDateString("th-TH")
        : "—";
      const tagClass = n.tag === "story" ? "tag-story" : n.tag === "update" ? "tag-update" : "tag-system";
      return `
        <div class="news-item">
          <div class="news-date">${date}</div>
          <div class="news-title">
            <span class="news-tag ${tagClass}">${(n.tag ?? "system").toUpperCase()}</span>
            ${n.title ?? ""}
          </div>
          <div class="news-body">${n.body ?? ""}</div>
        </div>`;
    }).join("");
  }
);
</script>

</body>
</html>
