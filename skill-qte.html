<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quick Time Event (QTE)</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 20px;
        }
        #qte-box {
            display: none;
            font-size: 24px;
            padding: 20px;
            background: red;
            color: white;
            border-radius: 10px;
            margin: 20px;
        }
        #arrows {
            font-size: 50px;
            margin-top: 20px;
        }
        #timer-bar-container {
            width: 100%;
            background: #ddd;
            height: 20px;
            margin-top: 10px;
            border-radius: 10px;
            overflow: hidden;
            display: none;
        }
        #timer-bar {
            width: 100%;
            height: 100%;
            background: rgb(0, 255, 0);
            transition: width linear;
        }
        #game-over {
            display: none;
            font-size: 20px;
            background: #222;
            color: white;
            padding: 20px;
            border-radius: 10px;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <h1>Quick Time Event</h1>
    <label>จำนวนปุ่มที่ต้องกด: <input type="number" id="num-buttons" value="1" min="1" max="5"></label>
    <br>
    <label>จำนวนรอบทั้งหมด: <input type="number" id="num-rounds" value="3" min="1" max="10"></label>
    <br>
    <label>เวลาต่อรอบ (วินาที): <input type="number" id="time-limit" value="2" min="1" max="5" step="0.5"></label>
    <br><br>
    <button id="start-btn">เริ่ม</button>

    <div id="qte-box">
        กดปุ่มตามลำดับ: <span id="arrows"></span>
    </div>

    <div id="timer-bar-container">
        <div id="timer-bar"></div>
    </div>

    <p id="result"></p>

    <div id="game-over">
        <h2>เกมจบแล้ว! 🎉</h2>
        <p id="summary"></p>
        <button onclick="location.reload()">เล่นอีกครั้ง</button>
    </div>

    <script>
        let timeout, timerInterval;
        let success = false;
        let isActive = false;
        let currentKeys = [];
        let currentIndex = 0;
        let roundsLeft = 0;
        let timeLimit = 2000;
        let startTime;
        let roundResults = [];

        const arrows = {
            "ArrowUp": "⬆️",
            "ArrowDown": "⬇️",
            "ArrowLeft": "⬅️",
            "ArrowRight": "➡️"
        };

        document.getElementById("start-btn").addEventListener("click", function() {
            let numButtons = parseInt(document.getElementById("num-buttons").value);
            roundsLeft = parseInt(document.getElementById("num-rounds").value);
            timeLimit = parseFloat(document.getElementById("time-limit").value) * 1000;
            document.getElementById("result").textContent = "";
            document.getElementById("game-over").style.display = "none";
            this.disabled = true;
            roundResults = [];
            startTime = Date.now();
            startRound(numButtons);
        });

        function startRound(numButtons) {
            if (roundsLeft <= 0) {
                endGame();
                return;
            }

            roundsLeft--;
            let delay = Math.random() * 2000 + 1000;
            setTimeout(() => {
                document.getElementById("qte-box").style.display = "block";
                document.getElementById("timer-bar-container").style.display = "block";
                success = false;
                isActive = true;
                currentKeys = [];
                currentIndex = 0;

                let keys = Object.keys(arrows);
                for (let i = 0; i < numButtons; i++) {
                    currentKeys.push(keys[Math.floor(Math.random() * keys.length)]);
                }
                document.getElementById("arrows").textContent = currentKeys.map(k => arrows[k]).join(" ");

                startTimer(timeLimit);

                timeout = setTimeout(() => {
                    if (!success) {
                        document.getElementById("result").textContent = "พลาด! คุณกดไม่ทัน";
                        isActive = false;
                        roundResults.push(`รอบ ${roundResults.length + 1}: ❌ กดได้ ${currentIndex}/${numButtons}`);
                    }
                    resetRound(numButtons);
                }, timeLimit);
            }, delay);
        }

        function startTimer(duration) {
            let startTime = Date.now();
            clearInterval(timerInterval);
            document.getElementById("timer-bar").style.width = "100%";

            timerInterval = setInterval(() => {
                let elapsed = Date.now() - startTime;
                let remaining = Math.max(0, duration - elapsed);
                let percent = (remaining / duration) * 100;
                document.getElementById("timer-bar").style.width = percent + "%";

                let red = Math.min(255, (1 - percent / 100) * 255);
                let green = Math.max(0, (percent / 100) * 255);
                document.getElementById("timer-bar").style.backgroundColor = `rgb(${red}, ${green}, 0)`;

                if (remaining <= 0) {
                    clearInterval(timerInterval);
                }
            }, 10);
        }

        document.addEventListener("keydown", function(event) {
            if (!isActive) return;

            if (document.getElementById("qte-box").style.display === "block") {
                if (event.code === currentKeys[currentIndex]) {
                    currentIndex++;
                    if (currentIndex >= currentKeys.length) {
                        clearTimeout(timeout);
                        clearInterval(timerInterval);
                        success = true;
                        isActive = false;
                        document.getElementById("result").textContent = `สำเร็จ! คุณกดครบแล้ว! ✅`;
                        roundResults.push(`รอบ ${roundResults.length + 1}: ✅ สำเร็จ (กดได้ ${currentIndex}/${currentKeys.length})`);
                        resetRound(currentKeys.length);
                    }
                } else {
                    document.getElementById("result").textContent = "พลาด! กดผิดปุ่ม ❌";
                    clearTimeout(timeout);
                    clearInterval(timerInterval);
                    isActive = false;
                    roundResults.push(`รอบ ${roundResults.length + 1}: ❌ กดได้ ${currentIndex}/${currentKeys.length}`);
                    resetRound(currentKeys.length);
                }
            }
        });

        function resetRound(numButtons) {
            setTimeout(() => {
                document.getElementById("qte-box").style.display = "none";
                document.getElementById("timer-bar-container").style.display = "none";
                startRound(numButtons);
            }, 1000);
        }

        function endGame() {
            let totalTime = ((Date.now() - startTime) / 1000).toFixed(2);
            document.getElementById("summary").innerHTML = roundResults.join("<br>") + `<br><br>⏳ เวลาที่ใช้ทั้งหมด: ${totalTime} วินาที`;
            document.getElementById("game-over").style.display = "block";
            document.getElementById("start-btn").disabled = false;
        }
    </script>

</body>
</html>
