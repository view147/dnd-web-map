<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>Player Backpack System — FIXED (DM Visible)</title>

<style>
body{
    background:#efe6d2;
    font-family:"Segoe UI",serif;
    color:#2b1e12;
    padding:20px;
}
.sheet{
    max-width:1100px;
    margin:auto;
    background:#fffdf6;
    border:2px solid #000;
    padding:20px;
}
.header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    border-bottom:2px solid #000;
    padding-bottom:8px;
    margin-bottom:12px;
}
button,input{
    font-family:inherit;
    border:1px solid #000;
    background:#eee;
    padding:4px 6px;
}
button:hover{background:#ddd;cursor:pointer}
.bag{
    border:2px solid #000;
    margin-bottom:22px;
    padding:14px;
}
.bag-head{
    display:flex;
    justify-content:space-between;
    font-weight:bold;
    margin-bottom:10px;
}
.warn{color:#b58900;}
.over{color:#c0392b;}
.section{
    border:1px solid #000;
    padding:10px;
    margin-bottom:10px;
}
.row{
    display:flex;
    gap:8px;
    align-items:center;
    margin-bottom:6px;
}
.modal{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.4);
    display:none;
    align-items:center;
    justify-content:center;
}
.modal-box{
    background:#fffdf6;
    border:2px solid #000;
    padding:16px;
    width:340px;
}
hr{border:none;border-top:1px solid #000;margin:10px 0;}
</style>

<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>

<script>
/* =========================
   FIREBASE INIT
========================= */
const firebaseConfig={
    apiKey:"AIzaSyD_ELoo4XEXn9Xoo7zulw7yG78yAsvDoEU",
    authDomain:"dnd-pale-character-5ec73.firebaseapp.com",
    projectId:"dnd-pale-character-5ec73"
};
if(!firebase.apps.length) firebase.initializeApp(firebaseConfig);
const db=firebase.firestore();

/* =========================
   GLOBAL STATE
========================= */
let CHARACTER_ID=null;
let STATE={bags:[]};
let unsubscribe=null;

/* =========================
   LOGIN
========================= */
function login(){
    const id=document.getElementById("login-id").value.trim();
    if(!id) return;
    CHARACTER_ID=id;
    localStorage.setItem("CHAR_ID",id);
    document.getElementById("login").style.display="none";
    document.getElementById("app").style.display="block";
    document.getElementById("player-name").textContent=id;
    subscribeCharacter();
}
function logout(){
    if(unsubscribe) unsubscribe();
    localStorage.removeItem("CHAR_ID");
    CHARACTER_ID=null;
    STATE={bags:[]};
    document.getElementById("app").style.display="none";
    document.getElementById("login").style.display="block";
}

/* =========================
   🔧 FIXED FIRESTORE SUBSCRIBE
   - สร้าง document ทันทีที่ล็อกอิน
   - DM จะเห็นผู้เล่นแน่นอน
========================= */
function subscribeCharacter(){
    if(unsubscribe) unsubscribe();

    const ref=db.collection("characters").doc(CHARACTER_ID);

    unsubscribe=ref.onSnapshot(doc=>{
        if(!doc.exists){
            STATE={bags:[]};
            ref.set({
                bags:[],
                createdAt:firebase.firestore.FieldValue.serverTimestamp()
            });
        }else{
            STATE=normalize(doc.data());
        }
        render();
    });
}

/* =========================
   SAVE
========================= */
function save(){
    if(!CHARACTER_ID) return;
    db.collection("characters").doc(CHARACTER_ID)
    .set(STATE,{merge:true})
    .catch(err=>console.error("Save failed:",err));
}

/* =========================
   NORMALIZE
========================= */
function normalize(data){
    return {
        bags:(data.bags||[]).map(b=>({
            name:b.name,
            max:Number(b.max),
            items:(b.items||[]).map(i=>({
                name:i.name,
                weight:Number(i.weight),
                qty:Number(i.qty)
            }))
        }))
    };
}

/* =========================
   WEIGHT LOGIC
========================= */
function bagWeight(b){
    return b.items.reduce((s,i)=>s+i.weight*i.qty,0);
}
function canAdd(b,w){
    return bagWeight(b)+w<=b.max;
}

/* =========================
   RENDER
========================= */
function render(){
    const box=document.getElementById("bags");
    box.innerHTML="";
    STATE.bags.forEach((b,bi)=>{
        const used=parseFloat(bagWeight(b).toFixed(2));
        const cls=used>b.max?"over":b.max-used<5?"warn":"";
        let html=`
        <div class="bag">
            <div class="bag-head">
                <span>${b.name}</span>
                <span class="${cls}">${used}/${b.max} kg</span>
            </div>
            <div class="section">`;
        if(b.items.length===0){
            html+=`<div style="color:#999;font-style:italic">— ยังไม่มีไอเทม —</div>`;
        }
        b.items.forEach((it,ii)=>{
            const lineW=(it.weight*it.qty).toFixed(2);
            html+=`
            <div class="row">
                <span style="flex:1">${it.name}</span>
                <span style="color:#666;font-size:0.85em">${it.weight}kg x${it.qty} = ${lineW}kg</span>
                <button onclick="removeOne(${bi},${ii})">-1</button>
                <button onclick="removeAll(${bi},${ii})">ลบ</button>
            </div>`;
        });
        html+=`
            </div>
            <div class="row">
                <input id="n${bi}" placeholder="ชื่อไอเทม">
                <input id="w${bi}" type="number" placeholder="kg" style="width:60px">
                <input id="q${bi}" type="number" value="1" style="width:50px">
                <button onclick="addItem(${bi})">+ เพิ่ม</button>
            </div>
            <div style="margin-top:8px">
                <button onclick="deleteBag(${bi})" style="background:#fdd;border-color:#c00;color:#c00">🗑️ ลบกระเป๋านี้</button>
            </div>
        </div>`;
        box.innerHTML+=html;
    });
}

/* =========================
   ACTIONS
========================= */
function addItem(bi){
    const n=document.getElementById("n"+bi).value.trim();
    const w=parseFloat(document.getElementById("w"+bi).value);
    const q=parseInt(document.getElementById("q"+bi).value)||1;
    if(!n||isNaN(w)||w<=0||q<=0) return;

    const bag=STATE.bags[bi];

    // เช็คน้ำหนักครั้งเดียวก่อนทำอะไรทั้งนั้น
    if(!canAdd(bag,w*q)){
        alert("น้ำหนักเกิน (ต้องการ "+(w*q).toFixed(2)+" kg แต่เหลือ "+(bag.max-bagWeight(bag)).toFixed(2)+" kg)");
        return;
    }

    const f=bag.items.find(i=>i.name===n&&i.weight===w);
    if(f){
        f.qty+=q;
    }else{
        bag.items.push({name:n,weight:w,qty:q});
    }
    save();
    render();
}
function deleteBag(bi){
    if(!confirm("ลบกระเป๋า \""+STATE.bags[bi].name+"\" ?")) return;
    STATE.bags.splice(bi,1);
    save();
    render();
}
function removeOne(bi,ii){
    const it=STATE.bags[bi].items[ii];
    it.qty--;
    if(it.qty<=0) STATE.bags[bi].items.splice(ii,1);
    save();
    render();
}
function removeAll(bi,ii){
    STATE.bags[bi].items.splice(ii,1);
    save();
    render();
}

/* =========================
   BAG CREATE
========================= */
function openBagModal(){
    document.getElementById("bname").value="";
    document.getElementById("bmax").value="";
    document.getElementById("modal").style.display="flex";
}
function closeModal(){
    document.getElementById("modal").style.display="none";
}
function createBag(){
    const n=document.getElementById("bname").value.trim();
    const m=parseFloat(document.getElementById("bmax").value);
    if(!n||!(m>0)) return;
    STATE.bags.push({name:n,max:m,items:[]});
    closeModal();
    save();
    render();
}

/* =========================
   AUTO LOGIN
========================= */
window.onload=()=>{
    const id=localStorage.getItem("CHAR_ID");
    if(id){
        document.getElementById("login-id").value=id;
        login();
    }
};
</script>
</head>

<body>

<div id="login" class="sheet">
<h3>Player Login</h3>
<input id="login-id" placeholder="Character ID" onkeydown="if(event.key==='Enter') login()">
<button onclick="login()">เข้าใช้งาน</button>
</div>

<div id="app" style="display:none">
<div class="sheet">
<div class="header">
<strong>Backpack Sheet</strong>
<span>
ผู้เล่น: <strong id="player-name"></strong>
<button onclick="logout()">ออกจากระบบ</button>
</span>
</div>

<button onclick="openBagModal()">+ เพิ่มกระเป๋า</button>
<hr>
<div id="bags"></div>
</div>
</div>

<div id="modal" class="modal" onclick="if(event.target===this) closeModal()">
<div class="modal-box">
<h3>สร้างกระเป๋า</h3>
ชื่อ: <input id="bname" onkeydown="if(event.key==='Enter') createBag()"><br><br>
น้ำหนักสูงสุด (kg): <input id="bmax" type="number" onkeydown="if(event.key==='Enter') createBag()"><br><br>
<button onclick="createBag()">สร้าง</button>
<button onclick="closeModal()">ยกเลิก</button>
</div>
</div>

</body>
</html>
