<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Fantasy Money Bag System</title>

<style>

/* ========================= */
/* GLOBAL */
/* ========================= */

body{
    margin:0;
    padding:20px;
    background:#1b1208;
    color:white;
    font-family:tahoma;
}

/* ========================= */
/* SHEET */
/* ========================= */

.sheet{
    max-width:1300px;
    margin:auto;
    background:#2a1b10;
    border:2px solid #c58a00;
    border-radius:16px;
    padding:20px;
    box-shadow:0 0 25px rgba(0,0,0,0.7);
}

/* ========================= */
/* HEADER */
/* ========================= */

.header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    border-bottom:2px solid #5e3c1f;
    padding-bottom:12px;
    margin-bottom:20px;
    flex-wrap:wrap;
    gap:10px;
}

.header strong{
    color:#ffd27a;
    font-size:24px;
}

/* ========================= */
/* BUTTON */
/* ========================= */

button{
    border:none;
    border-radius:8px;
    background:#d89b00;
    color:black;
    font-weight:bold;
    padding:10px 14px;
    cursor:pointer;
}

button:hover{
    background:#ffbf00;
}

/* ========================= */
/* INPUT */
/* ========================= */

input,
select{
    background:#5e3c1f;
    border:1px solid #c58a00;
    color:white;
    border-radius:8px;
    padding:10px;
    box-sizing:border-box;
}

/* ========================= */
/* BAG */
/* ========================= */

.moneyBag{
    background:#2d1c0f;
    border:2px solid #5e3c1f;
    border-radius:15px;
    padding:20px;
    margin-bottom:25px;
}

.moneyHead{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:15px;
    flex-wrap:wrap;
    gap:10px;
}

.moneyHead span{
    font-size:22px;
    color:#ffd27a;
}

.total{
    background:#1a1208;
    border:1px solid #c58a00;
    padding:8px 14px;
    border-radius:10px;
    font-size:22px;
    color:#ffd27a;
}

.section{
    background:#24170d;
    border:1px solid #5e3c1f;
    border-radius:12px;
    padding:15px;
    margin-bottom:15px;
}

.moneyGrid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:18px;
}

.moneyCard{
    background:#4a3018;
    border:1px solid #c58a00;
    border-radius:12px;
    padding:15px;
}

.moneyCard h3{
    margin-top:0;
    color:#ffd27a;
}

.moneyInput{
    margin-bottom:12px;
}

.moneyInput label{
    display:block;
    margin-bottom:5px;
    color:#ffd27a;
}

.moneyInput input{
    width:100%;
}

.row{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    align-items:center;
}

.log{
    background:#1a1208;
    border:1px solid #5e3c1f;
    border-radius:8px;
    padding:8px;
    margin-bottom:6px;
    word-break:break-word;
}

/* ========================= */
/* LOGIN */
/* ========================= */

#login{
    max-width:450px;
    margin:40px auto;
}

#login h2{
    color:#ffd27a;
}

hr{
    border:none;
    border-top:1px solid #5e3c1f;
    margin:20px 0;
}

</style>

<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>

<script>

/* ========================= */
/* FIREBASE */
/* ========================= */

const firebaseConfig={

    apiKey:"AIzaSyD_ELoo4XEXn9Xoo7zulw7yG78yAsvDoEU",
    authDomain:"dnd-pale-character-5ec73.firebaseapp.com",
    projectId:"dnd-pale-character-5ec73"

};

firebase.initializeApp(firebaseConfig);

const db=firebase.firestore();

/* ========================= */
/* GLOBAL */
/* ========================= */

let CHARACTER_ID=null;

let STATE={
    moneyBags:[]
};

let unsubscribe=null;

/* ========================= */
/* MONEY */
/* ========================= */

const rates={

    north_grain:0.002,
    north_sun:0.1,
    north_king:1,

    south_stone:0.0075,
    south_ridge:0.15,
    south_core:1.5,

    sky_breeze:0.003,
    sky_mist:0.3,
    sky_star:3,

    central_erin:1,

    west_shell:0.008,
    west_wave:0.08,
    west_ocean:0.8,

    east_green:0.0048,
    east_vine:0.12,
    east_guard:1.2

};

const names={

    north_grain:"Grain",
    north_sun:"Sunmark",
    north_king:"Sand King",

    south_stone:"Stone",
    south_ridge:"Ridge Crest",
    south_core:"Mountain Core",

    sky_breeze:"Breeze Chip",
    sky_mist:"Mist Crest",
    sky_star:"Aether Star",

    central_erin:"Erin",

    west_shell:"Shell",
    west_wave:"Wave Crest",
    west_ocean:"Ocean Heart",

    east_green:"Green Dent",
    east_vine:"Vine Crest",
    east_guard:"Guardian Mint"

};

/* ========================= */
/* LOGIN */
/* ========================= */

function login(){

    const id=document.getElementById("login-id").value.trim();

    if(!id){
        alert("ใส่ Character ID");
        return;
    }

    CHARACTER_ID=id;

    localStorage.setItem("CHAR_ID",id);

    document.getElementById("login").style.display="none";

    document.getElementById("app").style.display="block";

    document.getElementById("player-name").innerText=id;

    subscribeCharacter();

}

function logout(){

    if(unsubscribe){
        unsubscribe();
    }

    unsubscribe=null;

    CHARACTER_ID=null;

    STATE={
        moneyBags:[]
    };

    localStorage.removeItem("CHAR_ID");

    document.getElementById("app").style.display="none";

    document.getElementById("login").style.display="block";

}

/* ========================= */
/* FIRESTORE */
/* ========================= */

function subscribeCharacter(){

    if(unsubscribe){
        unsubscribe();
    }

    unsubscribe=db.collection("characters")
    .doc(CHARACTER_ID)
    .onSnapshot(

        (doc)=>{

            if(!doc.exists){

                STATE={
                    moneyBags:[]
                };

                save();

            }else{

                const data=doc.data() || {};

                STATE={
                    moneyBags:Array.isArray(data.moneyBags)
                    ? data.moneyBags
                    : []
                };

            }

            render();

        },

        (error)=>{

            console.error(error);

            alert("เชื่อม Firebase ไม่สำเร็จ");

        }

    );

}

function save(){

    if(!CHARACTER_ID) return;

    db.collection("characters")
    .doc(CHARACTER_ID)
    .set(STATE,{merge:true})
    .catch(err=>{

        console.error(err);

        alert("บันทึกข้อมูลไม่สำเร็จ");

    });

}

/* ========================= */
/* CREATE BAG */
/* ========================= */

function createMoneyBag(){

    const name=
    document.getElementById("bag-name").value.trim();

    if(!name){

        alert("ใส่ชื่อถุงเงิน");

        return;

    }

    STATE.moneyBags.push({

        name:name,

        logs:[],

        money:{

            north_grain:0,
            north_sun:0,
            north_king:0,

            south_stone:0,
            south_ridge:0,
            south_core:0,

            sky_breeze:0,
            sky_mist:0,
            sky_star:0,

            central_erin:0,

            west_shell:0,
            west_wave:0,
            west_ocean:0,

            east_green:0,
            east_vine:0,
            east_guard:0

        }

    });

    document.getElementById("bag-name").value="";

    save();

}

/* ========================= */
/* SET MONEY */
/* ========================= */

function setMoney(index,key,val){

    val=Number(val);

    if(isNaN(val) || val<0){
        val=0;
    }

    STATE.moneyBags[index].money[key]=val;

    save();

}

/* ========================= */
/* TOTAL */
/* ========================= */

function totalErin(bag){

    let total=0;

    for(let key in bag.money){

        total+=Number(bag.money[key] || 0)
        * rates[key];

    }

    return total.toFixed(2);

}

/* ========================= */
/* CONVERT */
/* ========================= */

function convertMoney(index){

    const bag=STATE.moneyBags[index];

    const amount=
    Number(document.getElementById("amount"+index).value);

    const from=
    document.getElementById("from"+index).value;

    const to=
    document.getElementById("to"+index).value;

    if(isNaN(amount) || amount<=0){

        alert("จำนวนไม่ถูกต้อง");

        return;

    }

    if((bag.money[from] || 0)<amount){

        alert("เงินไม่พอ");

        return;

    }

    const erin=amount*rates[from];

    const result=erin/rates[to];

    bag.money[from]-=amount;

    bag.money[to]=
    Number(bag.money[to] || 0)
    + Number(result.toFixed(2));

    if(!Array.isArray(bag.logs)){
        bag.logs=[];
    }

    bag.logs.unshift(

        "แลก "
        + amount
        + " "
        + names[from]
        + " → "
        + result.toFixed(2)
        + " "
        + names[to]

    );

    if(bag.logs.length>50){
        bag.logs.length=50;
    }

    save();

    render();

}

/* ========================= */
/* DELETE */
/* ========================= */

function deleteBag(index){

    if(!confirm("ลบถุงเงินนี้ ?")){
        return;
    }

    STATE.moneyBags.splice(index,1);

    save();

}

/* ========================= */
/* RENDER */
/* ========================= */

function render(){

    const box=document.getElementById("bags");

    box.innerHTML="";

    STATE.moneyBags.forEach((bag,index)=>{

        if(!bag.money){

            bag.money={};

        }

        let html=`

        <div class="moneyBag">

            <div class="moneyHead">

                <span>💰 ${bag.name || "ถุงเงิน"}</span>

                <span class="total">

                    ${totalErin(bag)} Erin

                </span>

            </div>

            <div class="section">

                <div class="moneyGrid">
        `;

        for(let key in names){

            if(typeof bag.money[key] === "undefined"){
                bag.money[key]=0;
            }

            html+=`

            <div class="moneyCard">

                <div class="moneyInput">

                    <label>${names[key]}</label>

                    <input type="number"

                    value="${bag.money[key]}"

                    onchange="setMoney(
                    ${index},
                    '${key}',
                    this.value
                    )">

                </div>

            </div>

            `;

        }

        html+=`

                </div>

            </div>

            <div class="section">

                <h3>💱 แลกเงิน</h3>

                <div class="row">

                    <input
                    type="number"
                    id="amount${index}"
                    placeholder="จำนวน">

                    <select id="from${index}">
        `;

        for(let key in names){

            html+=`

            <option value="${key}">

                ${names[key]}

            </option>

            `;

        }

        html+=`

                    </select>

                    <select id="to${index}">
        `;

        for(let key in names){

            html+=`

            <option value="${key}">

                ${names[key]}

            </option>

            `;

        }

        html+=`

                    </select>

                    <button onclick="convertMoney(${index})">

                        แลก

                    </button>

                </div>

            </div>

            <div class="section">

                <h3>📜 ประวัติ</h3>
        `;

        (bag.logs || []).forEach(log=>{

            html+=`

            <div class="log">

                ${log}

            </div>

            `;

        });

        html+=`

            </div>

            <button onclick="deleteBag(${index})">

                🗑️ ลบถุงเงิน

            </button>

        </div>

        `;

        box.innerHTML+=html;

    });

}

/* ========================= */
/* AUTO LOGIN */
/* ========================= */

window.onload=()=>{

    const id=localStorage.getItem("CHAR_ID");

    if(id){

        document.getElementById("login-id").value=id;

        login();

    }

};

</script>

</head>

<body>

<!-- LOGIN -->

<div id="login" class="sheet">

    <h2>💰 Money Bag Login</h2>

    <input
    id="login-id"
    placeholder="Character ID">

    <button onclick="login()">

        เข้าใช้งาน

    </button>

</div>

<!-- APP -->

<div id="app" style="display:none">

<div class="sheet">

<div class="header">

    <strong>Fantasy Money Bag</strong>

    <span>

        ผู้เล่น:
        <strong id="player-name"></strong>

        <button onclick="logout()">

            ออกจากระบบ

        </button>

    </span>

</div>

<div class="row">

    <input
    id="bag-name"
    placeholder="ชื่อถุงเงิน">

    <button onclick="createMoneyBag()">

        + เพิ่มถุงเงิน

    </button>

</div>

<hr>

<div id="bags"></div>

</div>

</div>

</body>
</html>
