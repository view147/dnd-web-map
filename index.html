<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>THE FLOOD</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0a0a0a;
      color: #ccc;
      font-family: 'Courier New', monospace;
      min-height: 100vh;
    }

    /* ── Header ── */
    #header {
      background: #111;
      border-bottom: 1px solid #333;
      padding: 10px 16px;
      display: flex;
      align-items: center;
      gap: 20px;
    }
    #header h1 { color: #f00; font-size: 18px; letter-spacing: 4px; }
    .stat { color: #888; font-size: 13px; }
    .stat span { color: #eee; }

    /* ── Layout ── */
    #layout {
      display: grid;
      grid-template-columns: 260px 1fr 220px;
      grid-template-rows: 1fr 180px;
      gap: 1px;
      background: #222;
      height: calc(100vh - 45px);
    }

    /* ── Panels ── */
    .panel {
      background: #0e0e0e;
      padding: 12px;
      overflow-y: auto;
    }
    .panel h2 {
      font-size: 11px;
      letter-spacing: 2px;
      color: #555;
      border-bottom: 1px solid #222;
      padding-bottom: 6px;
      margin-bottom: 10px;
    }

    /* ── Players Panel ── */
    #panel-players { grid-row: 1; grid-column: 1; }

    .player-card {
      border: 1px solid #2a2a2a;
      padding: 8px;
      margin-bottom: 8px;
      border-radius: 2px;
    }
    .player-card.infected { border-color: #6a3000; }
    .player-card.dead { opacity: 0.4; border-color: #400; }
    .player-name { font-size: 13px; color: #fff; margin-bottom: 4px; }
    .player-role { font-size: 11px; color: #666; margin-bottom: 6px; }

    .bar-row { display: flex; align-items: center; gap: 6px; margin-bottom: 3px; }
    .bar-label { font-size: 10px; color: #555; width: 14px; }
    .bar-bg { flex: 1; height: 6px; background: #1a1a1a; border-radius: 2px; }
    .bar-fill { height: 100%; border-radius: 2px; transition: width 0.3s; }
    .bar-hp .bar-fill { background: #4a4; }
    .bar-st .bar-fill { background: #44a; }
    .bar-in .bar-fill { background: #a40; }
    .bar-val { font-size: 10px; color: #555; width: 30px; text-align: right; }

    .tag {
      display: inline-block;
      font-size: 9px;
      padding: 1px 5px;
      border-radius: 2px;
      margin-top: 4px;
      margin-right: 3px;
    }
    .tag-infected { background: #6a2000; color: #f84; }
    .tag-restrained { background: #3a3000; color: #fa4; }
    .tag-dead { background: #400; color: #f44; }

    /* ── World Panel ── */
    #panel-world { grid-row: 1; grid-column: 2; }

    #world-info {
      border: 1px solid #222;
      padding: 10px;
      margin-bottom: 12px;
      font-size: 12px;
      line-height: 1.8;
    }
    #world-info .label { color: #555; }
    #world-info .value { color: #ccc; }

    #infection-bar-global {
      margin-bottom: 12px;
    }
    #infection-bar-global .label {
      font-size: 11px;
      color: #555;
      margin-bottom: 4px;
    }
    #infection-bar-global .bar-bg {
      height: 10px;
      background: #1a1a1a;
      border-radius: 2px;
    }
    #infection-bar-global .bar-fill {
      height: 100%;
      background: linear-gradient(to right, #a40, #f00);
      border-radius: 2px;
      transition: width 0.5s;
    }

    #ending-banner {
      display: none;
      background: #500;
      border: 1px solid #f00;
      padding: 10px;
      text-align: center;
      font-size: 14px;
      color: #f88;
      letter-spacing: 2px;
      margin-bottom: 12px;
    }

    /* ── GM Panel ── */
    #panel-gm { grid-row: 1; grid-column: 3; }

    .gm-section { margin-bottom: 12px; }
    .gm-section label { font-size: 10px; color: #555; display: block; margin-bottom: 4px; }

    select, input[type="number"] {
      width: 100%;
      background: #1a1a1a;
      border: 1px solid #333;
      color: #ccc;
      padding: 5px;
      font-family: monospace;
      font-size: 11px;
      margin-bottom: 6px;
    }

    button {
      width: 100%;
      padding: 6px;
      font-family: monospace;
      font-size: 11px;
      cursor: pointer;
      border: 1px solid #444;
      background: #1a1a1a;
      color: #ccc;
      margin-bottom: 4px;
      transition: background 0.2s;
    }
    button:hover { background: #2a2a2a; }
    button.primary { border-color: #a00; color: #f88; }
    button.primary:hover { background: #2a0000; }
    button.safe { border-color: #0a4; color: #4f8; }
    button.safe:hover { background: #001a00; }

    /* ── Log Panel ── */
    #panel-log { grid-row: 2; grid-column: 1 / 4; border-top: 1px solid #222; }
    #panel-log h2 { display: inline-block; margin-right: 10px; }

    #log-entries {
      display: flex;
      flex-direction: column-reverse;
      gap: 2px;
      max-height: 120px;
      overflow-y: auto;
    }
    .log-entry {
      font-size: 11px;
      color: #4a4;
      padding: 1px 0;
    }
    .log-entry.system { color: #555; }
    .log-entry.warning { color: #a84; }
    .log-entry.danger { color: #f44; }
  </style>
</head>
<body>

<!-- Header -->
<div id="header">
  <h1>THE FLOOD</h1>
  <div class="stat">TURN <span id="hdr-turn">1</span></div>
  <div class="stat">DAY <span id="hdr-day">1</span></div>
  <div class="stat">TIME <span id="hdr-time">MORNING</span></div>
  <div class="stat">PHASE <span id="hdr-phase">INIT</span></div>
</div>

<!-- Main Layout -->
<div id="layout">

  <!-- Players -->
  <div class="panel" id="panel-players">
    <h2>PLAYERS</h2>
    <div id="player-list"><!-- render.ts fills this --></div>
  </div>

  <!-- World -->
  <div class="panel" id="panel-world">
    <h2>WORLD</h2>
    <div id="ending-banner">🏁 ENDING: <span id="ending-type"></span></div>
    <div id="infection-bar-global">
      <div class="label">GLOBAL INFECTION <span id="infection-val">0</span>%</div>
      <div class="bar-bg"><div class="bar-fill" id="infection-fill" style="width:0%"></div></div>
    </div>
    <div id="world-info">
      <div><span class="label">MAP &nbsp;&nbsp;&nbsp;</span> <span class="value" id="w-map">—</span></div>
      <div><span class="label">ZONE &nbsp;&nbsp;</span> <span class="value" id="w-loc">—</span></div>
    </div>
  </div>

  <!-- GM Panel -->
  <div class="panel" id="panel-gm">
    <h2>GM TOOLS</h2>

    <div class="gm-section">
      <label>TARGET PLAYER</label>
      <select id="select-source"></select>
    </div>

    <div class="gm-section">
      <label>DAMAGE</label>
      <input type="number" id="input-damage" value="10" min="1" max="999" />
      <button id="btn-attack" class="primary">⚔ DEAL DAMAGE</button>
    </div>

    <div class="gm-section">
      <label>HEAL</label>
      <input type="number" id="input-heal" value="20" min="1" max="999" />
      <button id="btn-heal" class="safe">💊 HEAL PLAYER</button>
    </div>

    <div class="gm-section">
      <button id="btn-infect">☣ INFECT PLAYER</button>
      <button id="btn-restrain">🩹 RESTRAIN INFECTION</button>
    </div>

    <div class="gm-section">
      <button id="btn-end-turn">⏭ NEXT TURN</button>
      <button id="btn-check-ending" class="primary">🏁 CHECK ENDING</button>
    </div>
  </div>

  <!-- Log -->
  <div class="panel" id="panel-log">
    <h2>LOG</h2>
    <div id="log-entries"><!-- render.ts fills this --></div>
  </div>

</div>

<script type="module" src="./index.ts"></script>
</body>
</html>
