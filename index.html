<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <title>Pale – Character Builder</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Top Navigation -->
  <header class="top-bar">
    <div class="logo">PALE</div>

    <nav class="menu">
      <a href="#">Collections</a>
      <a href="#">Library</a>
      <a href="#">Tools</a>
      <a href="#">Rules</a>
    </nav>

    <div class="auth">
      <button class="btn ghost">Sign In</button>
      <button class="btn red">Sign Up</button>
    </div>
  </header>

  <!-- Hero Section -->
  <section class="hero">
    <div class="hero-content">
      <h1>Build Your Character</h1>
      <p>
        Create and manage your characters.<br>
        Shape your own world, your own rules.
      </p>

      <button class="btn big red">
        Build a Character →
      </button>
    </div>
  </section>

  <!-- Section Tabs -->
  <section class="tabs">
    <span class="active">CHARACTER</span>
    <span>MAPS</span>
    <span>LORE</span>
    <span>WORLD</span>
  </section>
<script src="auth.js"></script>
<script>
  const authBox = document.querySelector(".auth");

  if (isLoggedIn()) {
    authBox.innerHTML = `
      <button class="btn ghost" onclick="logout()">Logout</button>
    `;
  } else {
    authBox.innerHTML = `
      <button class="btn ghost" onclick="location.href='login.html'">Sign In</button>
    `;
  }
</script>
</body>
</html>
