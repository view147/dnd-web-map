<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>VESSEL — Card Battle</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Cinzel:wght@400;600;700&family=Sarabun:wght@300;400;600&display=swap" rel="stylesheet">
<style>

/* ── RESET ── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:      #08080f;
  --s1:      #0f0f18;
  --s2:      #161622;
  --s3:      #1c1c2e;
  --border:  #252535;
  --gold:    #c9a84c;
  --gold2:   #e8c97a;
  --red:     #c0392b;
  --blue:    #2a6dd9;
  --text:    #ddd8cc;
  --dim:     #50505a;
}

html, body {
  height: 100%;
  background: var(--bg);
  color: var(--text);
  font-family: 'Sarabun', sans-serif;
  overflow: hidden;
}

/* ── ANIMATED BACKGROUND ── */
.bg-layer {
  position: fixed; inset: 0; z-index: 0;
  background:
    radial-gradient(ellipse 70% 60% at 50% 110%, rgba(139,89,212,0.12), transparent 60%),
    radial-gradient(ellipse 50% 40% at 10% 10%,  rgba(192,57,43,0.07),  transparent 50%),
    radial-gradient(ellipse 40% 30% at 90% 5%,   rgba(42,109,217,0.06), transparent 50%),
    var(--bg);
}

/* Floating particles */
.particles {
  position: fixed; inset: 0; z-index: 0;
  pointer-events: none; overflow: hidden;
}
.particle {
  position: absolute;
  width: 2px; height: 2px;
  background: rgba(201,168,76,0.4);
  border-radius: 50%;
  animation: float linear infinite;
}
@keyframes float {
  0%   { transform: translateY(100vh) translateX(0); opacity: 0; }
  10%  { opacity: 1; }
  90%  { opacity: 1; }
  100% { transform: translateY(-10vh) translateX(30px); opacity: 0; }
}

/* ── PAGES ── */
.page {
  position: fixed; inset: 0; z-index: 1;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  gap: 0;
  transition: opacity 0.5s ease, transform 0.5s ease;
}
.page.hidden {
  opacity: 0; pointer-events: none;
  transform: translateY(20px);
}

/* ── TITLE PAGE ── */
#page-title { gap: 32px; }

.title-logo-wrap { text-align: center; }

.title-logo {
  font-family: 'Cinzel Decorative', cursive;
  font-size: clamp(3rem, 10vw, 7rem);
  font-weight: 900;
  background: linear-gradient(135deg, #6a4a10, var(--gold), var(--gold2), var(--gold), #6a4a10);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  letter-spacing: 8px;
  line-height: 1;
  animation: logoGlow 4s ease-in-out infinite;
  display: block;
}
@keyframes logoGlow {
  0%,100% { filter: brightness(1) drop-shadow(0 0 0px rgba(201,168,76,0)); }
  50%      { filter: brightness(1.3) drop-shadow(0 0 20px rgba(201,168,76,0.4)); }
}

.title-sub {
  font-family: 'Cinzel', serif;
  font-size: .75rem;
  color: var(--dim);
  letter-spacing: 8px;
  margin-top: 10px;
  text-transform: uppercase;
}

.title-divider {
  width: 120px; height: 1px;
  background: linear-gradient(90deg, transparent, var(--gold), transparent);
  margin: 0 auto;
}

/* ── TITLE BUTTONS ── */
.title-btns { display: flex; flex-direction: column; gap: 12px; width: 280px; }

.tbtn {
  display: block; width: 100%;
  background: transparent;
  border: 1px solid rgba(201,168,76,0.35);
  color: var(--gold);
  font-family: 'Cinzel', serif;
  font-size: .8rem;
  letter-spacing: 4px;
  padding: 14px;
  cursor: pointer;
  text-align: center;
  transition: all 0.25s;
  position: relative; overflow: hidden;
  text-decoration: none;
}
.tbtn::before {
  content: '';
  position: absolute; inset: 0;
  background: var(--gold);
  transform: scaleX(0); transform-origin: left;
  transition: transform 0.25s;
  z-index: -1;
}
.tbtn:hover { color: var(--bg); border-color: var(--gold); }
.tbtn:hover::before { transform: scaleX(1); }

.tbtn.secondary {
  border-color: var(--border);
  color: var(--dim);
  font-size: .72rem;
}
.tbtn.secondary::before { background: var(--s3); }
.tbtn.secondary:hover { color: var(--text); border-color: var(--dim); }

.version-tag {
  font-size: .55rem; color: var(--dim);
  letter-spacing: 3px; text-align: center;
  margin-top: 8px;
}

/* ── LOGIN PAGE ── */
#page-login { gap: 28px; }

.login-panel {
  background: rgba(15,15,24,0.85);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 36px 40px;
  width: 340px;
  backdrop-filter: blur(12px);
  box-shadow: 0 0 60px rgba(0,0,0,0.8);
}

.login-title {
  font-family: 'Cinzel', serif;
  font-size: .75rem;
  color: var(--gold);
  letter-spacing: 5px;
  text-align: center;
  margin-bottom: 28px;
  padding-bottom: 14px;
  border-bottom: 1px solid var(--border);
}

.form-group {
  display: flex; flex-direction: column;
  gap: 6px; margin-bottom: 16px;
}
.form-group label {
  font-size: .6rem;
  color: var(--dim);
  letter-spacing: 3px;
  text-transform: uppercase;
}
.form-group input {
  background: var(--s3);
  border: 1px solid var(--border);
  border-radius: 3px;
  color: var(--text);
  font-family: 'Sarabun', sans-serif;
  font-size: .85rem;
  padding: 10px 14px;
  transition: border-color 0.2s;
  outline: none;
  width: 100%;
}
.form-group input:focus { border-color: var(--gold); }
.form-group input::placeholder { color: var(--dim); font-size: .8rem; }

.form-error {
  font-size: .65rem;
  color: var(--red);
  letter-spacing: 1px;
  min-height: 18px;
  text-align: center;
}

.login-btn {
  width: 100%; margin-top: 8px;
  background: transparent;
  border: 1px solid var(--gold);
  color: var(--gold);
  font-family: 'Cinzel', serif;
  font-size: .75rem;
  letter-spacing: 4px;
  padding: 12px;
  cursor: pointer;
  transition: all 0.2s;
  position: relative; overflow: hidden;
}
.login-btn::before {
  content: '';
  position: absolute; inset: 0;
  background: var(--gold);
  transform: scaleX(0); transform-origin: left;
  transition: transform 0.2s; z-index: -1;
}
.login-btn:hover { color: var(--bg); }
.login-btn:hover::before { transform: scaleX(1); }

.login-switch {
  text-align: center;
  font-size: .65rem;
  color: var(--dim);
  margin-top: 16px;
}
.login-switch span {
  color: var(--gold);
  cursor: pointer;
  text-decoration: underline;
}
.login-switch span:hover { color: var(--gold2); }

.back-link {
  font-size: .6rem; color: var(--dim);
  cursor: pointer; letter-spacing: 2px;
  transition: color 0.2s;
  font-family: 'Cinzel', serif;
}
.back-link:hover { color: var(--gold); }

/* ── LOADING SCREEN ── */
#page-loading { gap: 20px; }

.loading-logo {
  font-family: 'Cinzel Decorative', cursive;
  font-size: 2rem; color: var(--gold);
  letter-spacing: 4px;
  animation: loadPulse 1.5s ease-in-out infinite;
}
@keyframes loadPulse { 0%,100%{opacity:1} 50%{opacity:0.4} }

.loading-bar-wrap {
  width: 260px;
}
.loading-bar {
  height: 2px;
  background: rgba(255,255,255,0.06);
  border-radius: 1px; overflow: hidden;
}
.loading-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--gold), var(--gold2));
  border-radius: 1px;
  width: 0%;
  transition: width 0.1s linear;
}
.loading-text {
  font-family: 'Cinzel', serif;
  font-size: .6rem; color: var(--dim);
  letter-spacing: 3px; text-align: center;
  margin-top: 8px;
}

/* ── SAVED USER CHIP ── */
.saved-users {
  display: flex; flex-direction: column; gap: 6px;
  margin-bottom: 20px;
}
.saved-user-chip {
  display: flex; align-items: center; gap: 10px;
  padding: 8px 12px;
  background: var(--s3);
  border: 1px solid var(--border);
  border-radius: 4px;
  cursor: pointer;
  transition: all 0.15s;
}
.saved-user-chip:hover { border-color: var(--gold); background: rgba(201,168,76,0.05); }
.suc-avatar {
  width: 32px; height: 32px; border-radius: 50%;
  background: linear-gradient(135deg, var(--s2), var(--s3));
  border: 1px solid var(--border);
  display: flex; align-items: center; justify-content: center;
  font-size: 1rem;
}
.suc-info { flex: 1; }
.suc-name  { font-size: .75rem; color: var(--text); }
.suc-label { font-size: .55rem; color: var(--dim); letter-spacing: 1px; }
.suc-arrow { color: var(--dim); font-size: .8rem; }

.divider-or {
  display: flex; align-items: center; gap: 10px;
  margin-bottom: 16px;
}
.divider-or::before,
.divider-or::after {
  content: ''; flex: 1; height: 1px; background: var(--border);
}
.divider-or span { font-size: .6rem; color: var(--dim); letter-spacing: 2px; }

</style>
</head>
<body>

<!-- Background -->
<div class="bg-layer"></div>
<div class="particles" id="particles"></div>

<!-- ══ PAGE: TITLE ══ -->
<div class="page" id="page-title">

  <div class="title-logo-wrap">
    <span class="title-logo">VESSEL</span>
    <div class="title-sub">Turn-Based Card Battle</div>
  </div>

  <div class="title-divider"></div>

  <div class="title-btns">
    <button class="tbtn" onclick="showPage('login')">⚔ ENTER</button>
    <button class="tbtn secondary" onclick="showPage('login', true)">+ NEW ACCOUNT</button>
    <button class="tbtn secondary" onclick="alert('Coming Soon — Online Multiplayer')">🌐 ONLINE</button>
  </div>

  <div class="version-tag">v0.1 — EARLY ACCESS</div>

</div>

<!-- ══ PAGE: LOGIN ══ -->
<div class="page hidden" id="page-login">

  <div class="login-panel" id="login-panel">
    <div class="login-title" id="login-title">SIGN IN</div>

    <!-- Saved accounts (shown if any exist) -->
    <div class="saved-users" id="saved-users" style="display:none"></div>
    <div class="divider-or" id="divider-or" style="display:none"><span>OR</span></div>

    <div class="form-group">
      <label>Username</label>
      <input type="text" id="input-username" placeholder="Enter username" autocomplete="username"/>
    </div>
    <div class="form-group">
      <label>Password</label>
      <input type="password" id="input-password" placeholder="Enter password" autocomplete="current-password"/>
    </div>
    <div class="form-error" id="form-error"></div>

    <button class="login-btn" id="login-btn" onclick="handleAuth()">ENTER THE VESSEL</button>

    <div class="login-switch" id="login-switch">
      Don't have an account? <span onclick="toggleMode()">Create one</span>
    </div>
  </div>

  <div class="back-link" onclick="showPage('title')">← Back</div>

</div>

<!-- ══ PAGE: LOADING ══ -->
<div class="page hidden" id="page-loading">
  <div class="loading-logo">VESSEL</div>
  <div class="loading-bar-wrap">
    <div class="loading-bar">
      <div class="loading-fill" id="loading-fill"></div>
    </div>
    <div class="loading-text" id="loading-text">Initializing...</div>
  </div>
</div>

<script>
// ── PARTICLES ────────────────────────────────────────────────
(function spawnParticles() {
  const container = document.getElementById('particles');
  for (let i = 0; i < 25; i++) {
    const p = document.createElement('div');
    p.className = 'particle';
    p.style.left     = Math.random() * 100 + '%';
    p.style.animationDuration = (8 + Math.random() * 12) + 's';
    p.style.animationDelay   = (-Math.random() * 20) + 's';
    p.style.opacity  = Math.random() * 0.5 + 0.2;
    p.style.width    = p.style.height = (Math.random() * 2 + 1) + 'px';
    container.appendChild(p);
  }
})();

// ── PAGE NAVIGATION ──────────────────────────────────────────
let isRegisterMode = false;

function showPage(name, forceRegister = false) {
  document.querySelectorAll('.page').forEach(p => p.classList.add('hidden'));
  document.getElementById('page-' + name).classList.remove('hidden');
  if (name === 'login') {
    if (forceRegister) setMode(true);
    else               setMode(false);
    renderSavedUsers();
  }
}

function toggleMode() { setMode(!isRegisterMode); }

function setMode(register) {
  isRegisterMode = register;
  document.getElementById('login-title').textContent  = register ? 'CREATE ACCOUNT' : 'SIGN IN';
  document.getElementById('login-btn').textContent    = register ? 'CREATE & ENTER' : 'ENTER THE VESSEL';
  document.getElementById('login-switch').innerHTML   = register
    ? 'Already have an account? <span onclick="toggleMode()">Sign in</span>'
    : "Don't have an account? <span onclick=\"toggleMode()\">Create one</span>";
  document.getElementById('form-error').textContent = '';
}

// ── AUTH ─────────────────────────────────────────────────────
function handleAuth() {
  const username = document.getElementById('input-username').value.trim();
  const password = document.getElementById('input-password').value;
  const errEl    = document.getElementById('form-error');

  if (!username) { errEl.textContent = 'กรุณาใส่ Username'; return; }
  if (!password) { errEl.textContent = 'กรุณาใส่ Password'; return; }
  if (username.length < 3) { errEl.textContent = 'Username ต้องมีอย่างน้อย 3 ตัวอักษร'; return; }

  const accounts = getAccounts();

  if (isRegisterMode) {
    if (accounts[username]) { errEl.textContent = 'Username นี้มีอยู่แล้ว'; return; }
    if (password.length < 4) { errEl.textContent = 'Password ต้องมีอย่างน้อย 4 ตัวอักษร'; return; }
    // Save new account
    accounts[username] = { password, createdAt: Date.now(), avatar: '⚔' };
    saveAccounts(accounts);
    errEl.textContent = '';
    loginUser(username);
  } else {
    if (!accounts[username]) { errEl.textContent = 'ไม่พบ Username นี้'; return; }
    if (accounts[username].password !== password) { errEl.textContent = 'Password ไม่ถูกต้อง'; return; }
    errEl.textContent = '';
    loginUser(username);
  }
}

function loginUser(username) {
  // Save session
  localStorage.setItem('vessel_session', JSON.stringify({
    username,
    loginAt: Date.now()
  }));

  // Add to recent users
  const recent = JSON.parse(localStorage.getItem('vessel_recent') || '[]');
  const filtered = recent.filter(u => u !== username);
  filtered.unshift(username);
  localStorage.setItem('vessel_recent', JSON.stringify(filtered.slice(0, 3)));

  // Show loading
  showPage('loading');
  startLoading();
}

function quickLogin(username) {
  // Quick login from saved chip
  const accounts = getAccounts();
  if (!accounts[username]) return;
  localStorage.setItem('vessel_session', JSON.stringify({ username, loginAt: Date.now() }));
  showPage('loading');
  startLoading();
}

// ── SAVED USERS ──────────────────────────────────────────────
function renderSavedUsers() {
  const recent = JSON.parse(localStorage.getItem('vessel_recent') || '[]');
  const accounts = getAccounts();
  const container = document.getElementById('saved-users');
  const divider   = document.getElementById('divider-or');

  const valid = recent.filter(u => accounts[u]);
  if (valid.length === 0) {
    container.style.display = 'none';
    divider.style.display   = 'none';
    return;
  }

  container.style.display = 'flex';
  divider.style.display   = 'flex';
  container.innerHTML = valid.map(u => `
    <div class="saved-user-chip" onclick="quickLogin('${u}')">
      <div class="suc-avatar">${accounts[u]?.avatar || '⚔'}</div>
      <div class="suc-info">
        <div class="suc-name">${u}</div>
        <div class="suc-label">CLICK TO CONTINUE</div>
      </div>
      <span class="suc-arrow">→</span>
    </div>
  `).join('');
}

// ── LOCAL STORAGE ─────────────────────────────────────────────
function getAccounts() {
  return JSON.parse(localStorage.getItem('vessel_accounts') || '{}');
}
function saveAccounts(data) {
  localStorage.setItem('vessel_accounts', JSON.stringify(data));
}

// ── LOADING ANIMATION ─────────────────────────────────────────
const LOAD_STEPS = [
  { pct: 10, text: 'Loading assets...' },
  { pct: 25, text: 'Preparing characters...' },
  { pct: 45, text: 'Initializing combat engine...' },
  { pct: 65, text: 'Building world...' },
  { pct: 80, text: 'Syncing data...' },
  { pct: 95, text: 'Almost ready...' },
  { pct: 100, text: 'Welcome, Vessel.' },
];

function startLoading() {
  const fill = document.getElementById('loading-fill');
  const text = document.getElementById('loading-text');
  let step = 0;

  const interval = setInterval(() => {
    if (step >= LOAD_STEPS.length) {
      clearInterval(interval);
      setTimeout(() => { window.location.href = 'home.html'; }, 400);
      return;
    }
    const s = LOAD_STEPS[step];
    fill.style.width  = s.pct + '%';
    text.textContent  = s.text;
    step++;
  }, 300);
}

// ── AUTO LOGIN CHECK ──────────────────────────────────────────
(function checkSession() {
  const session = JSON.parse(localStorage.getItem('vessel_session') || 'null');
  if (!session) return;
  // Session valid for 7 days
  const age = Date.now() - session.loginAt;
  if (age < 7 * 24 * 60 * 60 * 1000) {
    // Auto login — go straight to loading
    showPage('loading');
    startLoading();
  }
})();

// ── ENTER KEY ─────────────────────────────────────────────────
document.addEventListener('keydown', e => {
  if (e.key === 'Enter') {
    const loginPage = document.getElementById('page-login');
    if (!loginPage.classList.contains('hidden')) handleAuth();
  }
});
</script>

</body>
</html>
