<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>Your RPG Platform</title>
    <link rel="stylesheet" href="layout.css">
</head>
<body>

<div class="app">

    <!-- SIDEBAR -->
    <aside class="sidebar">
        <h1 class="logo">🜂 YOUR RPG</h1>

        <nav>
            <a class="active">Dashboard</a>
            <a>Characters</a>
            <a>Worlds</a>
            <a>Rules / Systems</a>
            <a>Tools</a>
        </nav>
    </aside>

    <!-- MAIN AREA -->
    <div class="main">

        <!-- TOPBAR -->
        <header class="topbar">
            <div class="world-name">World: Eralion</div>
            <div class="user">👤 Player</div>
        </header>

        <!-- CONTENT -->
        <section class="content">
            <h2>Dashboard</h2>
            <p>ยินดีต้อนรับสู่แพลตฟอร์มเกมของคุณ</p>

            <div class="cards">
                <div class="card">🎭 Characters</div>
                <div class="card">🌍 Worlds</div>
                <div class="card">🧙 Systems</div>
                <div class="card">🛠 Tools</div>
            </div>
        </section>

    </div>
</div>

</body>
</html>
