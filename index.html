<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Fantasy Game</title>

<style>

body{
margin:0;
font-family:Arial;
background:#0f1720;
color:white;
}

header{
display:flex;
justify-content:space-between;
align-items:center;
padding:15px 40px;
background:#111827;
}

.logo{
font-size:24px;
font-weight:bold;
color:#ff2a2a;
}

nav a{
margin:0 15px;
text-decoration:none;
color:white;
font-size:14px;
}

.right-menu button{
margin-left:10px;
padding:8px 16px;
border:none;
cursor:pointer;
}

.signin{
background:none;
color:white;
}

.create{
background:#ff2a2a;
color:white;
border-radius:4px;
}

.hero{
height:600px;
background-image:url("https://images.unsplash.com/photo-1605902711622-cfb43c4437d1");
background-size:cover;
background-position:center;
display:flex;
align-items:center;
padding-left:80px;
}

.hero-text{
max-width:500px;
}

.hero-text h1{
font-size:48px;
margin-bottom:20px;
}

.hero-text p{
opacity:0.8;
margin-bottom:25px;
}

.buy-btn{
background:#ff2a2a;
border:none;
padding:12px 24px;
font-size:16px;
color:white;
cursor:pointer;
}

.section{
padding:80px;
text-align:center;
}

</style>

</head>

<body>

<header>

<div class="logo">VIEW RPG</div>

<nav>
<a href="#">Play</a>
<a href="#">Rules</a>
<a href="#">Library</a>
<a href="#">Community</a>
</nav>

<div class="right-menu">
<button class="signin">Sign in</button>
<button class="create">Create Account</button>
</div>

</header>

<div class="hero">

<div class="hero-text">

<h1>Forge Wonders.<br>Defy Limits.</h1>

<p>
Create characters, cast spells, and explore a world of adventure.
</p>

<button class="buy-btn">Start Playing</button>

</div>

</div>

<div class="section">

<h2>Play Your Adventure</h2>

<p>All tools you need to run your tabletop game.</p>

</div>

</body>
</html>
