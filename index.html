<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>THE FLOOD</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=JetBrains+Mono:wght@400;600&display=swap');
    * { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg-void: #050805;
      --bg-panel: #0a120a;
      --border-dim: #18301c;
      --border-mid: #245a2c;
      --green-dim: #3a6b40;
      --green-mid: #5fa86a;
      --green-bright: #6dffa0;
      --green-text: #b9e8c2;
      --red-bright: #ff5c5c;
      --amber: #e8b85f;
    }

    body { background: var(--bg-void); color: var(--green-text); font-family: 'JetBrains Mono', monospace; min-height: 100vh; display: flex; flex-direction: column; }
    body::before { content:''; position:fixed; inset:0; background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,0.15) 2px, rgba(0,0,0,0.15) 4px); pointer-events:none; z-index:999; }

    #hero { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 60px 20px 40px; text-align: center; position: relative; }

    .bio-ring { position: absolute; border-radius: 50%; border: 1px solid var(--border-dim); animation: pulse 4s ease-in-out infinite; }
    .bio-ring:nth-child(1) { width: 400px; height: 400px; }
    .bio-ring:nth-child(2) { width: 600px; height: 600px; animation-delay: 1s; }
    .bio-ring:nth-child(3) { width: 800px; height: 800px; animation-delay: 2s; }
    @keyframes pulse { 0%,100%{opacity:.2} 50%{opacity:.6} }

    .hero-content { position: relative; z-index: 1; }
    .title-tag { font-size: 10px; letter-spacing: 6px; color: var(--green-dim); margin-bottom: 18px; }
    h1 { font-size: clamp(46px, 9vw, 84px); color: var(--green-bright); letter-spacing: 14px; text-shadow: 0 0 40px rgba(109,255,160,0.3); margin-bottom: 10px; line-height: 1; }
    .tagline { font-size: 13px; color: var(--green-dim); letter-spacing: 3px; margin-bottom: 44px; line-height: 1.9; }
    .tagline em { color: var(--green-text); font-style: normal; }

    .btn-group { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; margin-bottom: 48px; }
    .btn { padding: 12px 30px; font-family: inherit; font-size: 12px; letter-spacing: 3px; cursor: pointer; border: 1px solid; text-decoration: none; display: inline-block; transition: all .2s; }
    .btn-enter { background: rgba(95,168,106,0.08); border-color: var(--border-mid); color: var(--green-bright); }
    .btn-enter:hover { background: rgba(95,168,106,0.2); }
    .btn-gm { background: transparent; border-color: var(--border-dim); color: var(--green-dim); }
    .btn-gm:hover { border-color: var(--border-mid); color: var(--green-text); }

    #status-bar { display: flex; justify-content: center; gap: 28px; padding: 14px 20px; border-top: 1px solid var(--border-dim); font-size: 10px; color: var(--green-dim); flex-wrap: wrap; }
    .sitem span { color: var(--green-mid); }
    .sitem.online span { color: var(--green-bright); }
    .sitem.warning span { color: var(--amber); }
    .sitem.danger span { color: var(--red-bright); }

    #news { background: var(--bg-panel); border-top: 1px solid var(--border-dim); padding: 32px 20px; max-width: 700px; margin: 0 auto; width: 100%; }
    #news h2 { font-size: 10px; letter-spacing: 4px; color: var(--green-dim); margin-bottom: 20px; border-bottom: 1px solid var(--border-dim); padding-bottom: 8px; }
    .news-item { padding: 14px 0; border-bottom: 1px solid var(--border-dim); }
    .news-item:last-child { border-bottom: none; }
    .news-date { font-size: 9px; color: var(--green-dim); margin-bottom: 4px; }
    .news-tag { display: inline-block; font-size: 8px; padding: 1px 6px; margin-right: 6px; vertical-align: middle; letter-spacing: 1px; }
    .tag-system { background: rgba(74,126,201,0.15); color: #7aa8e0; }
    .tag-story { background: rgba(232,184,95,0.15); color: var(--amber); }
    .tag-update { background: rgba(95,168,106,0.15); color: var(--green-bright); }
    .news-title { font-size: 12px; color: var(--green-text); margin-bottom: 4px; }
    .news-body { font-size: 11px; color: var(--green-dim); line-height: 1.8; }

    footer { text-align: center; padding: 16px; font-size: 9px; color: var(--border-mid); border-top: 1px solid var(--border-dim); }
  </style>
</head>
<body>

<div id="hero">
  <div class="bio-ring"></div>
  <div class="bio-ring"></div>
  <div class="bio-ring"></div>

  <div class="hero-content">
    <div class="title-tag">SURVIVAL · TURN-BASED · CO-OP</div>
    <h1>THE FLOOD</h1>
    <div class="tagline">ไม่มีทางรักษา<br/><em>มีแค่ทางเลือก</em></div>

    <div class="btn-group">
      <a href="player.html" class="btn btn-enter">▶ เข้าสู่เกม</a>
      <a href="gm.html" class="btn btn-gm">⚙ GM</a>
    </div>
  </div>
</div>

<div id="status-bar">
  <div class="sitem" id="stat-season">SEASON <span>1</span></div>
  <div class="sitem online" id="stat-server">SERVER <span>ONLINE</span></div>
  <div class="sitem" id="stat-players">PLAYERS <span id="player-count">—</span></div>
  <div class="sitem warning" id="stat-infection">GLOBAL INFECTION <span id="infection-level">—</span></div>
</div>

<div id="news">
  <h2>TRANSMISSIONS — ข่าวสาร</h2>
  <div id="news-list">
    <div class="news-item">
      <div class="news-date">—</div>
      <div class="news-body" style="color:var(--border-mid)">กำลังโหลดข้อมูล...</div>
    </div>
  </div>
</div>

<footer>THE FLOOD — SEASON 1 &nbsp;|&nbsp; GM-DRIVEN SURVIVAL</footer>

<script type="module">
import { db } from "./firebase";
import { doc, onSnapshot, collection, query, orderBy, limit } from "firebase/firestore";

onSnapshot(doc(db, "games/session_1"), (snap) => {
  if (!snap.exists()) return;
  try {
    const state = JSON.parse(snap.data().state);
    const alive = state.players?.filter(p => p.alive).length ?? "—";
    document.getElementById("player-count").textContent = alive + " alive";
    const inf = state.world?.globalInfectionLevel ?? "—";
    const infEl = document.getElementById("infection-level");
    infEl.textContent = inf + "%";
    const statInf = document.getElementById("stat-infection");
    if (inf >= 70) statInf.className = "sitem danger";
    else if (inf >= 40) statInf.className = "sitem warning";
    else statInf.className = "sitem";
  } catch {}
});

onSnapshot(
  query(collection(db, "news"), orderBy("createdAt", "desc"), limit(10)),
  (snap) => {
    const list = document.getElementById("news-list");
    if (snap.empty) {
      list.innerHTML = `
        <div class="news-item">
          <div class="news-body" style="color:#2a2a2a">ยังไม่มีข้อมูล — GM จะอัพเดทที่นี่</div>
        </div>`;
      return;
    }
    list.innerHTML = snap.docs.map(d => {
      const n = d.data();
      const date = n.createdAt
        ? new Date(n.createdAt).toLocaleDateString("th-TH")
        : "—";
      const tagClass = n.tag === "story" ? "tag-story" : n.tag === "update" ? "tag-update" : "tag-system";
      return `
        <div class="news-item">
          <div class="news-date">${date}</div>
          <div class="news-title">
            <span class="news-tag ${tagClass}">${(n.tag ?? "system").toUpperCase()}</span>
            ${n.title ?? ""}
          </div>
          <div class="news-body">${n.body ?? ""}</div>
        </div>`;
    }).join("");
  }
);
</script>

</body>
</html>
