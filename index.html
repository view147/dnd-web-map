<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>Player World</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<!-- LOGIN PAGE -->
<div id="loginPage" class="center">

  <div class="login-box">
    <h2>🎮 Player Access</h2>

    <input
      id="playerCode"
      placeholder="Enter Player Code"
    >

    <button onclick="login()">Enter World</button>

    <hr>

    <button class="ghost" onclick="register()">
      Create New Player
    </button>

    <p id="msg"></p>
  </div>

</div>


<!-- GAME PAGE -->
<div id="gamePage" style="display:none">

<header>

  <h1>🌎 Pale World</h1>

  <div class="playerBar">

    Player Code:
    <span id="playerId"></span>

    <button onclick="logout()">Logout</button>

  </div>

</header>


<main>

<canvas id="gameCanvas" width="900" height="500"></canvas>

</main>

</div>

<script src="auth.js"></script>

</body>
</html>
