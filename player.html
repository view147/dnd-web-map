<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>THE FLOOD — Survivor Terminal</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=JetBrains+Mono:wght@400;600&display=swap');
    * { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg-void: #050805;
      --bg-panel: #0a120a;
      --bg-field: #0d1a0d;
      --border-dim: #18301c;
      --border-mid: #245a2c;
      --green-dim: #3a6b40;
      --green-mid: #5fa86a;
      --green-bright: #6dffa0;
      --green-text: #b9e8c2;
      --red-dim: #4a1515;
      --red-mid: #8a2828;
      --red-bright: #ff5c5c;
      --amber: #e8b85f;
      --blue: #4a7ec9;
    }

    body { background: var(--bg-void); color: var(--green-text); font-family: 'JetBrains Mono', monospace; min-height: 100vh; }
    body::before { content:''; position:fixed; inset:0; background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,0.15) 2px, rgba(0,0,0,0.15) 4px); pointer-events:none; z-index:999; }

    /* Login */
    #login-screen { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; }
    .login-frame { width: 300px; border: 1px solid var(--border-mid); background: var(--bg-panel); padding: 28px 24px; position: relative; }
    .login-frame::before { content:'SURVIVOR ACCESS'; position:absolute; top:-9px; left:16px; background:var(--bg-void); padding:0 8px; font-size:9px; letter-spacing:3px; color:var(--green-dim); }
    .login-title { font-size: 22px; letter-spacing: 7px; color: var(--green-bright); text-align: center; text-shadow: 0 0 12px rgba(109,255,160,0.35); margin-bottom: 2px; }
    .login-sub { font-size: 10px; letter-spacing: 3px; color: var(--green-dim); text-align: center; margin-bottom: 22px; }
    .field-label { font-size: 9px; letter-spacing: 2px; color: var(--green-dim); display:block; margin: 12px 0 4px; }
    #login-screen input { width: 100%; padding: 9px 10px; background: var(--bg-field); border: 1px solid var(--border-dim); color: var(--green-text); font-family: inherit; font-size: 13px; outline: none; }
    #login-screen input:focus { border-color: var(--border-mid); }
    #btn-login { width:100%; margin-top:20px; padding:10px; background: rgba(95,168,106,0.08); border:1px solid var(--border-mid); color: var(--green-bright); font-family: inherit; font-size: 12px; letter-spacing:3px; cursor:pointer; }
    #btn-login:hover { background: rgba(95,168,106,0.18); }
    #login-error { font-size: 11px; color: var(--red-bright); margin-top: 12px; text-align: center; }

    /* Game */
    #game-screen { display: none; }
    #header { background: var(--bg-panel); border-bottom: 1px solid var(--border-dim); padding: 0 16px; display: flex; align-items: center; gap: 18px; height: 42px; }
    .brand { font-size: 13px; letter-spacing: 4px; color: var(--green-bright); text-shadow: 0 0 10px rgba(109,255,160,0.3); }
    .hstat { font-size: 10px; color: var(--green-dim); }
    .hstat b { color: var(--green-text); }
    #btn-logout { margin-left: auto; font-size: 9px; letter-spacing: 2px; padding: 5px 10px; background: none; border: 1px solid var(--border-dim); color: var(--green-dim); cursor: pointer; font-family: inherit; }
    #btn-logout:hover { border-color: var(--border-mid); color: var(--green-text); }

    #layout { display: grid; grid-template-columns: 1fr 1fr; gap: 1px; background: var(--border-dim); padding: 1px; }
    .panel { background: var(--bg-panel); padding: 16px; }
    .panel-title { font-size: 9px; letter-spacing: 3px; color: var(--green-dim); border-bottom: 1px solid var(--border-dim); padding-bottom: 8px; margin-bottom: 14px; }

    #panel-character { grid-column: 1; }
    #p-char-name { font-size: 19px; color: var(--green-bright); margin-bottom: 2px; }
    #p-char-role { font-size: 11px; color: var(--green-dim); margin-bottom: 16px; }

    .bar-group { margin-bottom: 12px; }
    .bar-label { font-size: 10px; color: var(--green-dim); margin-bottom: 4px; display: flex; justify-content: space-between; }
    .bar-label span:last-child { color: var(--green-text); }
    .bar-bg { height: 9px; background: #0a0a0a; border: 1px solid var(--border-dim); }
    .bar-fill { height: 100%; transition: width .4s; }
    .bar-fill.hp { background: var(--green-mid); }
    .bar-fill.st { background: var(--blue); }
    .bar-fill.inf { background: var(--red-mid); }

    #p-status-tags { margin-top: 14px; display: flex; flex-wrap: wrap; gap: 6px; }
    .stag { font-size: 9px; padding: 3px 8px; letter-spacing: 1px; }
    .stag.infected { background: var(--red-dim); color: var(--red-bright); }
    .stag.restrained { background: rgba(232,184,95,0.12); color: var(--amber); }
    .stag.alive { background: rgba(95,168,106,0.12); color: var(--green-bright); }
    .stag.dead { background: var(--red-dim); color: var(--red-bright); }

    #panel-world { grid-column: 2; }
    .wrow { font-size: 11px; padding: 5px 0; color: var(--green-dim); display: flex; justify-content: space-between; border-bottom: 1px solid var(--border-dim); }
    .wrow span:last-child { color: var(--green-text); }
    #ginf-wrap { margin-bottom: 14px; }
    #p-ginf-label { font-size: 10px; color: var(--green-dim); margin-bottom: 5px; display:flex; justify-content:space-between; }
    #p-ginf-val { color: var(--amber); font-weight: 600; }
    #p-ginf-bg { height: 8px; background: #0a0a0a; border: 1px solid var(--border-dim); }
    #p-ginf-fill { height: 100%; background: linear-gradient(90deg, var(--green-mid), var(--amber), var(--red-mid)); transition: width .4s; }

    #ending-notice { display:none; grid-column: 1 / 3; background: rgba(255,92,92,0.08); border: 1px solid var(--red-mid); padding: 12px; text-align: center; color: var(--red-bright); font-size: 14px; letter-spacing: 2px; }

    #panel-inventory { grid-column: 1; }
    .inv-item { font-size: 11px; color: var(--green-text); padding: 5px 0; border-bottom: 1px solid var(--border-dim); }
    .inv-empty { font-size: 11px; color: var(--green-dim); }

    #panel-notes { grid-column: 2; }
    #player-note { width: 100%; height: 120px; background: var(--bg-field); border: 1px solid var(--border-dim); color: var(--green-text); font-family: inherit; font-size: 11px; padding: 8px; resize: none; outline: none; }
    #player-note:focus { border-color: var(--border-mid); }
    #btn-save-note { margin-top: 6px; padding: 6px 12px; width: auto; background: rgba(95,168,106,0.08); border: 1px solid var(--border-mid); color: var(--green-bright); font-family: inherit; font-size: 10px; letter-spacing: 1px; cursor: pointer; }
    #note-saved { font-size: 9px; color: var(--green-mid); margin-left: 8px; }

    #panel-log { grid-column: 1 / 3; }
    #p-log-entries { display: flex; flex-direction: column-reverse; gap: 2px; max-height: 130px; overflow-y: auto; }
    .lentry { font-size: 10px; color: var(--green-mid); padding: 1px 0; }

    #phase-banner { grid-column: 1 / 3; text-align: center; padding: 8px; font-size: 11px; letter-spacing: 4px; background: var(--bg-panel); border-bottom: 1px solid var(--border-dim); color: var(--green-dim); }
    #phase-banner.combat { color: var(--red-bright); background: rgba(255,92,92,0.05); }
    #phase-banner.event { color: var(--amber); background: rgba(232,184,95,0.05); }

    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: var(--bg-void); }
    ::-webkit-scrollbar-thumb { background: var(--border-mid); }
  </style>
</head>
<body>

<div id="login-screen">
  <div class="login-frame">
    <div class="login-title">THE FLOOD</div>
    <div class="login-sub">SURVIVOR LOGIN</div>
    <label class="field-label">Email</label>
    <input type="email" id="login-email" placeholder="you@example.com" />
    <label class="field-label">Password</label>
    <input type="password" id="login-password" placeholder="••••••••" />
    <button id="btn-login">▶ เข้าสู่เกม</button>
    <div id="login-error"></div>
  </div>
</div>

<div id="game-screen">
  <div id="header">
    <span class="brand">THE FLOOD</span>
    <span class="hstat">TURN <b id="p-turn">1</b></span>
    <span class="hstat">DAY <b id="p-day">1</b></span>
    <span class="hstat"><b id="p-time">MORNING</b></span>
    <button id="btn-logout">⏻ ออกจากระบบ</button>
  </div>

  <div id="layout">

    <div id="phase-banner">— WAITING FOR GM —</div>
    <div id="ending-notice">🏁 ENDING: <span id="p-ending-type"></span></div>

    <div class="panel" id="panel-character">
      <div class="panel-title">YOUR CHARACTER</div>
      <div id="p-char-name">—</div>
      <div id="p-char-role">—</div>

      <div class="bar-group">
        <div class="bar-label"><span>HP</span><span id="p-hp-val">—</span></div>
        <div class="bar-bg"><div class="bar-fill hp" id="p-hp-bar" style="width:100%"></div></div>
      </div>
      <div class="bar-group">
        <div class="bar-label"><span>STAMINA</span><span id="p-st-val">—</span></div>
        <div class="bar-bg"><div class="bar-fill st" id="p-st-bar" style="width:100%"></div></div>
      </div>
      <div class="bar-group">
        <div class="bar-label"><span>INFECTION</span><span id="p-inf-val">Stage 0</span></div>
        <div class="bar-bg"><div class="bar-fill inf" id="p-inf-bar" style="width:0%"></div></div>
      </div>

      <div id="p-status-tags"></div>
    </div>

    <div class="panel" id="panel-world">
      <div class="panel-title">WORLD</div>
      <div id="ginf-wrap">
        <div id="p-ginf-label">GLOBAL INFECTION <span id="p-ginf-val">0</span></div>
        <div id="p-ginf-bg"><div id="p-ginf-fill" style="width:0%"></div></div>
      </div>
      <div class="wrow"><span>MAP</span><span id="p-map">—</span></div>
      <div class="wrow"><span>ZONE</span><span id="p-loc">—</span></div>
    </div>

    <div class="panel" id="panel-inventory">
      <div class="panel-title">INVENTORY</div>
      <div id="p-inventory"><div class="inv-empty">ไม่มีไอเทม</div></div>
    </div>

    <div class="panel" id="panel-notes">
      <div class="panel-title">MY NOTES (ส่วนตัว — GM ไม่เห็น)</div>
      <textarea id="player-note" placeholder="จดโน้ตส่วนตัวที่นี่"></textarea>
      <div>
        <button id="btn-save-note">💾 บันทึก</button>
        <span id="note-saved"></span>
      </div>
    </div>

    <div class="panel" id="panel-log">
      <div class="panel-title">GM LOG</div>
      <div id="p-log-entries"></div>
    </div>

  </div>
</div>

<script type="module" src="./player.ts"></script>
</body>
</html>
