<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <title>Player Login</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="center">

  <div class="login-box">
    <h2>Player Access</h2>

    <input
      id="playerCode"
      placeholder="Enter Player Code"
    />

    <button onclick="login()">Enter World</button>

    <hr>

    <button class="ghost" onclick="register()">
      Create New Player
    </button>

    <p id="msg"></p>
  </div>

  <script src="auth.js"></script>
</body>
</html>
